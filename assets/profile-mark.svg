<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Zhao Jiabao profile visual</title>
  <desc id="desc">A clean personal-site visual with Chengdu skyline, mountain contours, and the initials ZJB.</desc>
  <defs>
