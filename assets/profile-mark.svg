      <stop offset="1" stop-color="#ef6f4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#16313f" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="640" rx="42" fill="url(#sky)"/>
  <circle cx="746" cy="134" r="62" fill="url(#sun)" opacity="0.92"/>
