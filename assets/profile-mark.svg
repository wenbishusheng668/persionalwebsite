    <text x="132" y="334" fill="#17313a" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" letter-spacing="0">ZJB</text>
    <text x="137" y="383" fill="#42616b" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Zhao Jiabao</text>
